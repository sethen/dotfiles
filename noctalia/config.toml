[shell]
font_family = "JetBrains Mono"

[shell.launcher]
categories = false
show_icons = false

[shell.panel]
shadow = false
# floating, not attached: attached panels never get a border
control_center_placement = "floating"
session_placement = "floating"
wallpaper_placement = "floating"

[theme]
source = "community"
community_palette = "Catppuccin Mocha Blue"

# write the palette into gtk, qt and kde apps so they follow it (dark) instead
# of their light defaults. kitty is left out: kitty.conf pins its own theme
[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "qt", "kcolorscheme" ]

[audio]
# no sound on notifications (or any other noctalia event)
enable_sounds = false

[location]
auto_locate = true

[weather]
unit = "imperial"

[wallpaper]
directory = "~/Developer/wallpapers"

[bar.default]
start = [ "workspaces" ]
center = [ "clock", "weather" ]
end = [ "media", "volume", "bluetooth", "network", "session" ]
margin_ends = 0
radius = 0
widget_spacing = 12

[widget.workspaces]
show_labels = false
active_pill_size = 2.2
pill_scale = 0.7
show_tooltip = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.media]
# no "nothing playing" placeholder; the widget only shows while something plays
hide_when_no_media = true
hide_album_art = true
title_scroll = "always"

[widget.clock]
format = "{:%A %-I:%M %p}"
tooltip_format = "{:%-d %B W%V %Y}"

[widget.weather]
show_condition = false
show_temperature = false
