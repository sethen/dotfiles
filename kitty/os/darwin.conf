# macOS-only kitty settings. Symlinked to ~/.config/kitty/os-local.conf by
# symlink-kitty-config-files and included from the bottom of kitty.conf.

# no XDG_RUNTIME_DIR on macOS; kitty expands {kitty_pid} in either location.
listen_on unix:/tmp/kitty-{kitty_pid}

# keep the native titlebar but tint it to match the pinned palette
macos_titlebar_color background
hide_window_decorations titlebar-only

# left alt as Meta so the CSI-u bindings and TUI alt-chords behave as on Linux
macos_option_as_alt left

# the dock icon should not resurrect a quit app when the last window closes
macos_quit_when_last_window_closed yes
