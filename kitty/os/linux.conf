# Linux-only kitty settings. Symlinked to ~/.config/kitty/os-local.conf by
# symlink-kitty-config-files and included from the bottom of kitty.conf.

# XDG_RUNTIME_DIR does not exist on macOS, which is why this is not in the
# shared file. tab-search.sh talks to kitty over this socket, and the name
# matches the one /etc/xdg/kitty/kitty.conf uses so Omarchy's own tooling still
# finds it.
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# hyprland draws no server-side decorations and omarchy expects none.
hide_window_decorations yes
