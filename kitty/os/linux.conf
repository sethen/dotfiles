# Linux-only kitty settings. Symlinked to ~/.config/kitty/os-local.conf by
# symlink-kitty-config-files and included from the bottom of kitty.conf.

# XDG_RUNTIME_DIR does not exist on macOS, which is why this is not in the
# shared file. tab-search.sh talks to kitty over this socket.
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# hyprland draws no server-side decorations.
hide_window_decorations yes
