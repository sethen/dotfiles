# kitty. shared across every OS; the platform-specific handful lives in
# os/{linux,darwin}.conf, which symlink-kitty-config-files links to os-local.conf.
#
#   fonts, colours, chrome   here
#   the status bar           tab_bar.py   (tab_bar_style custom)
#   the workspaces           sessions/*.kitty-session + goto_session

# --- fonts -------------------------------------------------------------------

# SethensSuperCode has to answer for U+F000-U+F1B2 and nothing else. kitty maps
# codepoint ranges to fonts explicitly with symbol_map, so the reservation is
# stated outright rather than arranged through fallback ordering.
#
# the primary is the *unpatched* JetBrains Mono: it sets the cell metrics, and a
# patched primary would answer for those codepoints first.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# SethensSuperCode answers for its reserved range and nothing else.
symbol_map U+F000-U+F1B2 SethensSuperCode

# every other nerd font range goes to the patched build. note the exact family
# name: "JetBrainsMono Nerd Font", not "... Nerd Font Mono", which is a separate
# family that is not installed here.
symbol_map U+E000-U+EFFF,U+F1B3-U+F8FF,U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# a little extra leading
modify_font cell_height 115%

# --- colours: catppuccin mocha, pinned ---------------------------------------

# an exact palette, pinned deliberately. NOT including
# ~/.local/state/omarchy/current/theme/kitty.conf, which is tokyo night and
# changes under omarchy's theme switcher. add that include back if you would
# rather follow the switcher.

foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #cdd6f4
selection_background  #585b70

cursor                #f5e0dc
cursor_text_color     #1e1e2e

# palette 0-7
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #a6adc8

# palette 8-15
color8  #585b70
color9  #f37799
color10 #89d88b
color11 #ebd391
color12 #74a8fc
color13 #f2aede
color14 #6bd7ca
color15 #bac2de

# the UI_* constants in tab_bar.py mirror these
active_tab_foreground   #89b4fa
active_tab_background   #181825
inactive_tab_foreground #6c7086
inactive_tab_background #181825
tab_bar_background      #181825

active_border_color   #cba6f7
inactive_border_color #45475a

# --- window chrome -----------------------------------------------------------

# one value, or four in CSS order (top right bottom left). no bottom padding so
# the tab bar sits flush.
window_padding_width 6 8 0 8

confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no

cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# deliberately NOT setting `shell`. kitty's default is `.`, meaning $SHELL or the
# passwd entry, and child.py prefixes argv[0] with '-' for the default shell, so it
# is already a login shell - which is what makes config.fish run and mise activate.
# Hardcoding /usr/bin/fish would break on macOS, where fish lives under Homebrew.

# --- tab bar -----------------------------------------------------------------

tab_bar_edge   bottom
tab_bar_style  custom
# start, not center: tab_bar.py centres the tabs itself. kitty's own centring
# (align_with_factor) shifts the whole line right with insert_characters, which
# would carry the right-pinned session badge off the edge with it. See the note
# at the top of tab_bar.py.
tab_bar_align  start
tab_bar_min_tabs 1
# Omarchy ships /etc/xdg/kitty/kitty.conf, which kitty reads before this file and
# which sets `{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}`.
# That renders the agent tabs as "opencode :2:", because the lazygit split makes
# them two windows. tab_bar.py draws its own window/zoom indicator, so the title
# is just the title.
tab_title_template {title}

# show only the tabs belonging to the session you are in, plus any tab that
# belongs to no session. Without this every goto_session would pile its tabs on
# top of the previous session's in the same window. kitty restricts goto_tab,
# next_tab and previous_tab to the matching set automatically, so tab navigation
# stays inside the current session too.
tab_bar_filter session:~ or session:^$
# kitty defaults the active tab to bold-italic; bold alone reads better here.
active_tab_font_style   bold
inactive_tab_font_style normal
# keep in step with TAB_MAX_WIDTH in tab_bar.py
tab_title_max_length 24

# --- remote control ----------------------------------------------------------

# allow_remote_control is portable; the socket path is not, so `listen_on`
# lives in os-local.conf. tab-search.sh needs both.
allow_remote_control yes

# --- keys --------------------------------------------------------------------
#
# kitty's defaults are left intact; everything added here sits on a combination
# kitty leaves free. Verified against `load_config()` - the only default this
# file shadows is shift+insert, deliberately.
#
# so all of these still work, unmodified:
#   ctrl+shift+t / q          new tab / close tab
#   ctrl+shift+left / right   previous / next tab
#   ctrl+shift+up / down      scroll by line
#   alt+1 .. alt+9            go to tab N
#   ctrl+shift+enter          new split
#   ctrl+shift+[ / ]          previous / next split
#   ctrl+shift+1 .. 9         go to split N
#   ctrl+shift+r              resize mode (arrows, then enter)
#   ctrl+shift+f2             edit this file
#   ctrl+shift+f5             reload it

# the one deliberate override: shift+insert displaces kitty's
# paste_from_selection in favour of the clipboard.
map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter     send_text all \x1b[13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so
# tmux can match M-S-Enter.
map alt+shift+enter send_text all \x1b[13;4u

# --- the two pickers ---------------------------------------------------------
#
#   ctrl+shift+space      find a tab, by typing
#   ctrl+shift+semicolon  find a session, by typing
#
# both are fzf overlays, because kitty's own select_tab and goto_session render
# numbered lists through the hints kitten rather than filters. Both keys are
# free in kitty's defaults and in Omarchy's /etc/xdg config, so nothing is
# displaced to get them.

# type to filter across every tab in every session. kitty's own select_tab is a
# numbered list rather than a filter (choose_entry renders through the hints
# kitten), so this shells out to fzf. See tab-search.sh.
map ctrl+shift+space launch --type=overlay --title "tab search" sh ~/.config/kitty/tab-search.sh

# type to filter the sessions. same story: goto_session's own picker is a
# numbered list, not a filter. See session-search.sh.
map ctrl+shift+semicolon launch --type=overlay --title "session search" sh ~/.config/kitty/session-search.sh

# the built-ins, kept as no-dependency fallbacks: numbered lists, pick by index
map ctrl+shift+alt+space select_tab
map ctrl+shift+alt+o     goto_session

# --- sessions (one per project) ----------------------------------------------

# named, so they are reachable directly and so get_all_known_sessions() can see
# them without the session having been opened once first.
map ctrl+shift+alt+1 goto_session sessions/main.kitty-session
map ctrl+shift+alt+2 goto_session sessions/dotfiles.kitty-session
map ctrl+shift+alt+3 goto_session sessions/gem.kitty-session

# work sessions live in local/, which is gitignored, so their project names stay
# out of this public repo. globinclude matches nothing when local/ is empty, so a
# fresh clone loads cleanly without it.
globinclude local/*.conf

# --- splits ------------------------------------------------------------------

# kitty only ships cycling (ctrl+shift+[ and ]); these add directional focus.
map ctrl+shift+alt+left  neighboring_window left
map ctrl+shift+alt+right neighboring_window right
map ctrl+shift+alt+up    neighboring_window up
map ctrl+shift+alt+down  neighboring_window down

# the zoom the tab bar draws its indicator for
map ctrl+shift+alt+z toggle_layout stack

# deliberately no `startup_session`. A session file has to begin with
# new_os_window so goto_session gives it a window of its own; create_session()
# skips that empty leading session, but the startup path materialises it, so a
# bare `kitty` would open the session plus an empty stray window. A plain window
# on SUPER+RETURN and sessions asked for by name is the better split anyway.

# --- no session persistence --------------------------------------------------
#
# kitty has no server behind the GUI: detach_tab and detach_window only move
# windows between OS windows, so closing a window kills its panes. sessions are
# named and switchable, but they do not outlive the kitty process. run tmux
# inside these tabs if you want that; the CSI-u bindings above are ready for it.

# --- per-OS ------------------------------------------------------------------

# kitty has no conditional include, so the platform decides what this name points
# at: symlink-kitty-config-files links kitty/os/{linux,darwin}.conf here. Last in
# the file, so the platform's values win over anything shared above.
include os-local.conf
